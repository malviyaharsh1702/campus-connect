<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - CampusConnect</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #070d1a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .card {
            background: #101827;
            border: 1px solid rgba(96, 165, 250, 0.13);
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
        }

        .logo {
            text-align: center;
            margin-bottom: 10px;
            font-size: 30px;
            font-weight: bold;
            color: #60a5fa;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 30px;
            font-size: 14px;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 23px;
        }

        .description {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border-radius: 9px;
            border: 1px solid rgba(96, 165, 250, 0.18);
            background: #0b1422;
            color: #f8fafc;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        input::placeholder {
            color: #64748b;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #3b82f6;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 18px;
            padding: 11px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .success {
            display: block;
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.25);
            color: #34d399;
        }

        .error {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #f87171;
        }

        .back-login {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #718096;
        }

        .back-login a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
        }

        .back-login a:hover {
            text-decoration: underline;
        }

        #passwordStep {
            display: none;
        }

        .step-text {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">CampusConnect</div>

        <!-- STEP 1 -->
        <div id="emailStep">

            <h2>Forgot Password?</h2>

            <p class="description">
                Enter your registered email address to continue.
            </p>

            <form id="emailForm">

                <div class="form-group">
                    <label for="email">
                        Registered Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your registered email"
                        required
                    >
                </div>

                <button type="submit" id="continueBtn">
                    Continue
                </button>

            </form>

            <p class="step-text">
                Step 1 of 2
            </p>

        </div>


        <!-- STEP 2 -->
        <div id="passwordStep">

            <h2>Reset Password</h2>

            <p class="description">
                Create a new password for your CampusConnect account.
            </p>

            <form id="passwordForm">

                <div class="form-group">
                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        minlength="6"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        minlength="6"
                        required
                    >
                </div>

                <button type="submit" id="resetBtn">
                    Reset Password
                </button>

            </form>

            <p class="step-text">
                Step 2 of 2
            </p>

        </div>


        <!-- MESSAGE -->
        <div id="message" class="message"></div>


        <!-- BACK TO LOGIN -->
        <div class="back-login">
            Remember your password?
            <a href="login.html">Back to Login</a>
        </div>

    </div>

</div>


<script>

    // Backend URL
    const API_URL = "http://127.0.0.1:5000";


    // Elements
    const emailStep = document.getElementById("emailStep");
    const passwordStep = document.getElementById("passwordStep");

    const emailForm = document.getElementById("emailForm");
    const passwordForm = document.getElementById("passwordForm");

    const emailInput = document.getElementById("email");
    const newPasswordInput = document.getElementById("newPassword");
    const confirmPasswordInput = document.getElementById("confirmPassword");

    const continueBtn = document.getElementById("continueBtn");
    const resetBtn = document.getElementById("resetBtn");

    const message = document.getElementById("message");


    // Reset token
    let resetToken = null;


    // =====================================================
    // SHOW MESSAGE
    // =====================================================

    function showMessage(text, type) {

        message.textContent = text;

        message.className = "message " + type;

    }


    // =====================================================
    // STEP 1 - EMAIL
    // =====================================================

    emailForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        const email = emailInput.value.trim();

        if (!email) {
            showMessage("Please enter your email.", "error");
            return;
        }

        continueBtn.disabled = true;
        continueBtn.textContent = "Checking...";

        message.className = "message";


        try {

            const response = await fetch(
                `${API_URL}/api/forgot-password`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email
                    })
                }
            );


            const data = await response.json();


            if (!response.ok) {

                showMessage(
                    data.message || "Unable to continue.",
                    "error"
                );

                continueBtn.disabled = false;
                continueBtn.textContent = "Continue";

                return;
            }


            // Save reset token temporarily
            resetToken = data.resetToken;


            // Move to password step
            emailStep.style.display = "none";
            passwordStep.style.display = "block";

            message.className = "message";


        } catch (error) {

            console.error(error);

            showMessage(
                "Unable to connect to server.",
                "error"
            );

        }


        continueBtn.disabled = false;
        continueBtn.textContent = "Continue";

    });


    // =====================================================
    // STEP 2 - RESET PASSWORD
    // =====================================================

    passwordForm.addEventListener("submit", async function(event) {

        event.preventDefault();


        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;


        if (!resetToken) {

            showMessage(
                "Reset session expired. Please start again.",
                "error"
            );

            return;
        }


        if (newPassword.length < 6) {

            showMessage(
                "Password must be at least 6 characters.",
                "error"
            );

            return;
        }


        if (newPassword !== confirmPassword) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;
        }


        resetBtn.disabled = true;
        resetBtn.textContent = "Resetting...";

        message.className = "message";


        try {

            const response = await fetch(
                `${API_URL}/api/reset-password`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        resetToken: resetToken,
                        newPassword: newPassword
                    })
                }
            );


            const data = await response.json();


            if (!response.ok) {

                showMessage(
                    data.message || "Password reset failed.",
                    "error"
                );

                resetBtn.disabled = false;
                resetBtn.textContent = "Reset Password";

                return;
            }


            showMessage(
                "Password reset successfully! Redirecting to login...",
                "success"
            );


            // Remove token from memory
            resetToken = null;


            // Redirect to login
            setTimeout(function() {

                window.location.href = "login.html";

            }, 1500);


        } catch (error) {

            console.error(error);

            showMessage(
                "Unable to connect to server.",
                "error"
            );

            resetBtn.disabled = false;
            resetBtn.textContent = "Reset Password";

        }

    });

</script>

</body>
</html>
